name: Refresh TikTok stats

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-tiktok-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch public TikTok profile stats
        run: node scripts/update-stats.mjs
        env:
          TIKTOK_USERNAME: veyrix7

      - name: Commit updated stats
        run: |
          if git diff --quiet -- stats.json; then
            echo "Stats did not change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "chore: refresh TikTok stats"
          git push
